# .github/workflows/pristine-preview.yml
# Runs the app in YOUR CI (your dependencies, env, seeded data) and tunnels it
# to pristine for the minutes the design review takes; then the job exits and
# the tunnel closes. Nothing to provision: the job's GitHub OIDC token proves
# the repo and commit, and the tunnel needs no account.
name: pristine preview
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Seed data
        run: npm run seed
      - name: Start the app
        run: |
          (npm run start > app.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf "http://localhost:3000/" >/dev/null && break; sleep 2; done
      - name: Tunnel to pristine and wait for the review
        run: |
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared && chmod +x cloudflared
          ./cloudflared tunnel --url "http://localhost:3000" --no-autoupdate > tunnel.log 2>&1 &
          for i in $(seq 1 30); do URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1); [ -n "$URL" ] && break; sleep 2; done
          test -n "$URL" || { echo "no tunnel URL"; cat tunnel.log; exit 1; }
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pristine.style" | jq -r .value)
          REG=$(curl -sS --fail-with-body -X POST https://pristine.style/api/tunnels \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"url\": \"$URL\"}")
          echo "$REG"
          echo "pristine access check: $(echo "$REG" | jq -r '.access.detail // \"not run\"')"
          POLL=$(echo "$REG" | jq -r .poll)
          for i in $(seq 1 120); do
            STATE=$(curl -sS "https://pristine.style$POLL" | jq -r .state)
            [ "$STATE" = "done" ] && break
            sleep 10
          done
          echo "review done; closing the tunnel"
